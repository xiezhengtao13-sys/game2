<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>离散星海 · 卡戎号残响</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <script>
    window.__errors = [];
    function recordError(msg) {
      window.__errors.push(String(msg));
    }
    window.addEventListener("error", function (e) { recordError(e.message); });
    window.addEventListener("unhandledrejection", function (e) { recordError(e.reason); });
  </script>
  <div id="stage">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div id="corner-controls">
      <button id="btn-mute" type="button" title="切换配乐与音效 (M)">🔊 音效</button>
      <button id="btn-fs" type="button" title="切换全屏 (F)">⛶ 全屏</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
