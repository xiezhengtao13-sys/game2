<script>
  window.addEventListener("DOMContentLoaded", () => {
    window.focus();
    const cvs = document.getElementById("gameCanvas");
    if (cvs) {
      cvs.setAttribute("tabindex", "0");
      cvs.focus();
    }
    const banner = document.createElement("div");
    banner.id = "focus-hint";
    banner.style.cssText = "position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(6,182,212,0.92);color:#030712;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:bold;font-family:sans-serif;pointer-events:none;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:opacity 0.6s;";
    banner.textContent = "🎮 点击画面获取焦点 · WASD 移动 · E 交互 · M 蓝图小地图";
    document.body.appendChild(banner);
    const dismiss = () => {
      banner.style.opacity = "0";
      setTimeout(() => banner.remove(), 600);
      window.removeEventListener("keydown", dismiss);
      window.removeEventListener("pointerdown", dismiss);
    };
    window.addEventListener("keydown", dismiss, { once: true });
    window.addEventListener("pointerdown", dismiss, { once: true });
  });
</script>

<body>
  <!--
    Surfaces uncaught errors in the HUD instead of only the console. This makes
    "no obvious console errors" checkable from a headless screenshot or DOM dump,
    which is otherwise impossible in this environment.
  -->
  <script>
    window.__errors = [];
    function showError(message) {
      window.__errors.push(String(message));
      var el = document.getElementById("status");
      if (el) el.textContent = "ERROR: " + message;
    }
    window.addEventListener("error", function (e) { showError(e.message); });
    window.addEventListener("unhandledrejection", function (e) { showError(e.reason); });
  </script>
  <div id="app">
    <div id="hud">
      <span>离散星海</span>
      <span id="status">加载中…</span>
    </div>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>
</body>
